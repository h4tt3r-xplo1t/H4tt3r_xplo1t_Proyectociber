name: Seguridad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs only on pull requests; on main every push must
  # finish its scan, so back-to-back merges never skip a secrets check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No `name:` on any job: the check name shown to GitHub is the job id,
  # and these ids are what will be configured as required status checks.
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Official release binary pinned by sha256 instead of gitleaks/gitleaks-action:
      # fewer third-party actions, no extra token permissions needed.
      - name: Descargar y verificar gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Escanear secretos en el historial
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v .'

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Descargar y verificar actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Lint de workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each suite exits non-zero on any failed case, which fails this job.
      # Add the application test commands here once the stack is chosen.
      - name: Pruebas de guardia.sh
        run: |
          bash tests/hooks/guardia_test.sh

      - name: Pruebas de politica del ruleset de main
        run: |
          bash tests/rulesets/main_ruleset_test.sh

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/gateway
    env:
      UV_VERSION: 0.12.21
      UV_SHA256: 23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pattern as gitleaks: official release binary pinned by sha256
      # instead of astral-sh/setup-uv, so no extra third-party action runs.
      - name: Descargar y verificar uv
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  uv.tar.gz" | sha256sum -c -
          tar -xzf uv.tar.gz --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # --locked fails if uv.lock is out of date with pyproject.toml, and
      # every package is checked against the hashes in the lockfile.
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Formato
        run: uv run --locked ruff format --check

      - name: Pruebas
        run: uv run --locked pytest
