name: Seguridad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs only on pull requests; on main every push must
  # finish its scan, so back-to-back merges never skip a secrets check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No `name:` on any job: the check name shown to GitHub is the job id,
  # and these ids are what will be configured as required status checks.
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Official release binary pinned by sha256 instead of gitleaks/gitleaks-action:
      # fewer third-party actions, no extra token permissions needed.
      - name: Descargar y verificar gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Escanear secretos en el historial
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v .'

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Descargar y verificar actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Lint de workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each suite exits non-zero on any failed case, which fails this job.
      # Add the application test commands here once the stack is chosen.
      - name: Pruebas de guardia.sh
        run: |
          bash tests/hooks/guardia_test.sh

      - name: Pruebas de politica del ruleset de main
        run: |
          bash tests/rulesets/main_ruleset_test.sh

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/gateway
    env:
      UV_VERSION: 0.12.21
      UV_SHA256: 23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0
      # CI-only throwaway credentials: the database is ephemeral, lives on
      # this runner and is not reachable from outside. Not a real secret.
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:ci-only-throwaway@localhost:5432/gateway_ci
      # The OpenBao the tests read from is started by docker compose below;
      # its dev unseal key and AppRole files live only in this runner's
      # .local/ directory and are never printed.
      GATEWAY_OPENBAO_ADDR: http://127.0.0.1:8200
      GATEWAY_OPENBAO_ROLE_ID_FILE: ${{ github.workspace }}/.local/openbao/role-id
      GATEWAY_OPENBAO_SECRET_ID_FILE: ${{ github.workspace }}/.local/openbao/secret-id
    # Same image and digest as docker-compose.yml. The tests run the
    # migrations themselves (tests/conftest.py), so no extra step is needed.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: gateway_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A service container cannot override the command, and OpenBao must run
      # in server mode (not -dev), so compose starts it with the pinned image
      # from docker-compose.yml. The POSTGRES_* values are only needed because
      # compose validates the whole file; the postgres service is not started.
      - name: Iniciar OpenBao
        working-directory: ${{ github.workspace }}
        env:
          POSTGRES_USER: unused
          POSTGRES_PASSWORD: unused
          POSTGRES_DB: unused
        run: |
          docker compose up -d --wait openbao
          scripts/openbao-dev-init.sh

      # Same pattern as gitleaks: official release binary pinned by sha256
      # instead of astral-sh/setup-uv, so no extra third-party action runs.
      # UV_SHA256 is the digest of the linux x86_64 asset only.
      - name: Descargar y verificar uv
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL --retry 3 -o uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  uv.tar.gz" | sha256sum -c -
          # A dedicated directory keeps the rest of RUNNER_TEMP off the PATH.
          mkdir uv-bin
          tar -xzf uv.tar.gz -C uv-bin --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"

      # --locked fails if uv.lock is out of date with pyproject.toml, and
      # every package is checked against the hashes in the lockfile.
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Formato
        run: uv run --locked ruff format --check

      - name: Pruebas
        run: uv run --locked pytest
