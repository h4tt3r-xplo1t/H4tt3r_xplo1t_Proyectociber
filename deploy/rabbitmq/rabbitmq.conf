# RabbitMQ configuration for development and CI (ADR 0008).
# The vhost, exchanges, queues, bindings and queue policies are loaded from the
# definitions file at boot. With a definitions import the broker creates
# neither the default `guest` user nor the default vhost. Users and their
# permissions are NOT in the definitions: scripts/rabbitmq-dev-init.sh creates
# them from the environment.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

# AMQP only. The image has no management plugin, so there is no HTTP UI or API.
# The host side publishes this port on 127.0.0.1 only (docker-compose.yml).
listeners.tcp.default = 5672
