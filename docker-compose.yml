# Local development only. Never use this file for any shared or production
# environment. Credentials come from your shell environment (see .env.example);
# there are deliberately no defaults.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in your environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in your environment}
    # Bound to loopback only: the database is not reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # Secrets manager (MPL-2.0 fork of Vault). Server mode with raft storage,
  # never -dev. Initialise and unseal it with scripts/openbao-dev-init.sh.
  openbao:
    image: openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    # Explicit command: the image's `server` shortcut adds -dev flags.
    command: ["bao", "server", "-config=/openbao/config/config.hcl"]
    # IPC_LOCK lets the server mlock its memory so secrets are not swapped
    # to disk, instead of disabling mlock.
    cap_add:
      - IPC_LOCK
    environment:
      # Makes `docker compose exec openbao bao ...` talk to the local listener
      # over plain HTTP (the CLI defaults to HTTPS).
      BAO_ADDR: http://127.0.0.1:8200
    # Bound to loopback only: not reachable from the network.
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./deploy/openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao_data:/openbao/file
    healthcheck:
      # Reports the process is up even while sealed or uninitialised
      # (those states answer 200 with these parameters).
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200&standbyok=true'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  openbao_data:
