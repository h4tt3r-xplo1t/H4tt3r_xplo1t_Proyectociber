[project]
name = "worker-noticias"
version = "0.1.0"
description = "News worker of H4tt3r_1nf0rm4t1v0: periodically reads outlet RSS feeds and news sitemaps."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "defusedxml>=0.7.1",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
    "urllib3>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# Not built as a package: no build backend is needed, which keeps one less
# dependency in the supply chain. Tests import the code through `pythonpath`.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# S: flake8-bandit security rules.
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest checks results with plain `assert`; S101 targets production code,
# where asserts are stripped under `python -O`.
"tests/**" = ["S101"]
